- uid: TinyLife.World.AnimatedDoor.CanWalkThrough(TinyLife.World.Map,TinyLife.World.WallLike,TinyLife.Objects.MapObject)
  commentId: M:TinyLife.World.AnimatedDoor.CanWalkThrough(TinyLife.World.Map,TinyLife.World.WallLike,TinyLife.Objects.MapObject)
  id: CanWalkThrough(TinyLife.World.Map,TinyLife.World.WallLike,TinyLife.Objects.MapObject)
  parent: TinyLife.World.AnimatedDoor
  langs:
  - csharp
  - vb
  name: CanWalkThrough(Map, WallLike, MapObject)
  nameWithType: AnimatedDoor.CanWalkThrough(Map, WallLike, MapObject)
  fullName: TinyLife.World.AnimatedDoor.CanWalkThrough(TinyLife.World.Map, TinyLife.World.WallLike, TinyLife.Objects.MapObject)
  type: Method
  assemblies:
  - TinyLife
  namespace: TinyLife.World
  summary: >-
    Returns whether a <xref href="TinyLife.Objects.PersonLike" data-throw-if-not-resolved="false"></xref> is able to walk through a <xref href="TinyLife.World.WallLike" data-throw-if-not-resolved="false"></xref> that has this opening.

    This returns true for <xref href="TinyLife.World.WalkableOpening" data-throw-if-not-resolved="false"></xref> and <xref href="TinyLife.World.LockableAnimatedDoor" data-throw-if-not-resolved="false"></xref> and false for <xref href="TinyLife.World.Opening" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public override bool CanWalkThrough(Map map, WallLike wall, MapObject obj)
    parameters:
    - id: map
      type: TinyLife.World.Map
    - id: wall
      type: TinyLife.World.WallLike
    - id: obj
      type: TinyLife.Objects.MapObject
    return:
      type: System.Boolean
      description: ''
    content.vb: Public Overrides Function CanWalkThrough(map As Map, wall As WallLike, obj As MapObject) As Boolean
  overridden: TinyLife.World.WalkableOpening.CanWalkThrough(TinyLife.World.Map,TinyLife.World.WallLike,TinyLife.Objects.MapObject)
  overload: TinyLife.World.AnimatedDoor.CanWalkThrough*
- uid: TinyLife.World.AnimatedDoor.IsOpen(TinyLife.World.Map,TinyLife.World.WallLike)
  commentId: M:TinyLife.World.AnimatedDoor.IsOpen(TinyLife.World.Map,TinyLife.World.WallLike)
  id: IsOpen(TinyLife.World.Map,TinyLife.World.WallLike)
  parent: TinyLife.World.AnimatedDoor
  langs:
  - csharp
  - vb
  name: IsOpen(Map, WallLike)
  nameWithType: AnimatedDoor.IsOpen(Map, WallLike)
  fullName: TinyLife.World.AnimatedDoor.IsOpen(TinyLife.World.Map, TinyLife.World.WallLike)
  type: Method
  assemblies:
  - TinyLife
  namespace: TinyLife.World
  summary: >-
    Calculates and returns whether this opening is currently open.

    This method returns true if any people that <xref href="TinyLife.World.AnimatedDoor.CanWalkThrough(TinyLife.World.Map%2cTinyLife.World.WallLike%2cTinyLife.Objects.MapObject)" data-throw-if-not-resolved="false"></xref> this door are close enough for it to display as opened.
  example: []
  syntax:
    content: public virtual bool IsOpen(Map map, WallLike wall)
    parameters:
    - id: map
      type: TinyLife.World.Map
      description: The map that the opening is on
    - id: wall
      type: TinyLife.World.WallLike
      description: The wall that the opening is in
    return:
      type: System.Boolean
      description: Whether this opening is currently open
    content.vb: Public Overridable Function IsOpen(map As Map, wall As WallLike) As Boolean
  overload: TinyLife.World.AnimatedDoor.IsOpen*
