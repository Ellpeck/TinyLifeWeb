  - TinyLife
  namespace: TinyLife.World
  summary: >-
    A natural tile category, which refers to tiles that can hold plants, trees, etc.

    Tiles with this category allow <xref href="TinyLife.Objects.Furniture" data-throw-if-not-resolved="false"></xref> with the ObjectCategory.NaturalGroundRequired category to be placed on them.
  example: []
  syntax:
