on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
jobs:
  check-links:
    runs-on: ubuntu-latest
    env:
      LYCHEE_ARGS: --host-concurrency 1 --host-request-interval 10s -r 10 -v
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
      - name: Check Docs Links
        if: always()
        uses: lycheeverse/lychee-action@v2
        with:
          args: $LYCHEE_ARGS docs/articles/**/*.md docs/articles/**/*.yml
      - name: Check Blog Links
        uses: lycheeverse/lychee-action@v2
        if: always()
        with:
          args: $LYCHEE_ARGS web/_posts/**/*.md
      - name: Check Web Data Links
        uses: lycheeverse/lychee-action@v2
        if: always()
        with:
          args: $LYCHEE_ARGS web/_data/**/*.json
      - name: Check Changelog Links
        uses: lycheeverse/lychee-action@v2
        if: always()
        with:
          args: $LYCHEE_ARGS Changelog.md
